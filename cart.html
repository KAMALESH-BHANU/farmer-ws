<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmXchange - Cart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-top: 100px;
      background: linear-gradient(-45deg, #32CD32, #2E8B57, #228B22, #006400);
      background-size: 400% 400%;
      animation: gradientBG 6s infinite linear;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.8em;
      position: fixed;
      top: 0;
      left: 0;
    }

    .cart-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      flex-grow: 1; /* ✅ Allows content to push footer down */
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      border-radius: 5px;
      object-fit: cover;
    }

    .remove-btn {
      background: red;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: darkred;
    }

    /* ✅ Highlighted Total Price Box */
    .total-box {
      display: inline-block;
      padding: 10px 20px;
      font-size: 1.8em;
      font-weight: bold;
      color: #FFD700;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #FFD700;
      border-radius: 10px;
      margin-top: 10px;
    }

    .cart-buttons {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .cart-buttons button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: 0.3s;
    }

    .home-btn {
      background: orange;
      color: white;
    }

    .home-btn:hover {
      background: darkorange;
    }

    .continue-btn {
      background: white;
      color: black;
    }

    .continue-btn:hover {
      background: lightgray;
    }

    .checkout-btn {
      background: orange;
      color: white;
    }

    .checkout-btn:hover {
      background: darkorange;
    }

    /* ✅ Fixed Footer */
    footer {
      background-color: black;
      color: #6c9d5b;
      padding: 10px 0;
      text-align: center;
      margin-top: auto;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    🛒 Your Cart
  </header>

  <div class="cart-container" id="cart-container">
    <div id="cart-items">
      <!-- Cart items will be loaded here -->
    </div>
    <div class="cart-summary">
      <h2>Total: <span class="total-box">₹0.00</span></h2>
      <div class="cart-buttons">
        <button class="home-btn" onclick="window.location.href='newhome.html'">🏠 Back to Home</button>
        <button class="continue-btn" onclick="window.location.href=getLastVisitedPage()">🛍 Continue Shopping</button>
        <button class="checkout-btn">✅ Proceed to Checkout</button>
      </div>
    </div>
  </div>
  <br>
  <footer>
    <br>
    <p>&copy; 2025 FarmXchange. All Rights Reserved.</p><br>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", fetchCartItems);

    function fetchCartItems() {
      fetch("http://localhost:5000/cart-items")
        .then(response => response.json())
        .then(items => {
          const cartItems = document.getElementById("cart-items");
          const totalElement = document.querySelector(".cart-summary .total-box");
          let total = 0;
          cartItems.innerHTML = "";

          if (items.length === 0) {
            cartItems.innerHTML = '<p class="empty-message">Your cart is empty! 🛒</p>';
            totalElement.textContent = "₹0.00";
            return;
          }

          items.forEach(item => {
            total += item.price;
            cartItems.innerHTML += `
              <div class="cart-item" id="cart-item-${item._id}">
                <img src="data:image/jpeg;base64,${item.image || ''}" alt="${item.name}">
                <div>
                  <h3>${item.name}</h3>
                  <p>Price: ₹${item.price}</p>
                </div>
                <button class="remove-btn" onclick="removeFromCart('${item._id}')">Remove</button>
              </div>`;
          });

          totalElement.textContent = `₹${total.toFixed(2)}`;
        })
        .catch(error => console.error("Error fetching cart items:", error));
    }

    function removeFromCart(id) {
      fetch(`http://localhost:5000/remove-from-cart/${id}`, { method: "DELETE" })
        .then(response => response.json())
        .then(data => {
          alert(data.message);
          document.getElementById(`cart-item-${id}`).remove(); // ✅ Remove item from UI without refreshing
          fetchCartItems(); // ✅ Refresh total price dynamically
        })
        .catch(error => console.error("Error:", error));
    }

    function getLastVisitedPage() {
      return localStorage.getItem("lastVisitedPage") || "newhome.html";
    }
  </script>
</body>
</html>
