<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmXchange - Fruits</title>
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }

        /* ✅ Updated Header */
        header {
            background-color: #6c9d5b;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ✅ Centered Navigation */
        .nav-center {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }

        .nav-links {
            list-style-type: none;
            display: flex;
            gap: 30px;
        }

        .nav-links li {
            display: inline;
        }

        .nav-links li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 25px;
        }

        /* ✅ Cart & Farmer Product Icons (Right Side) */
        .header-icons {
            display: flex;
            gap: 20px;
        }

        .icon-link {
            text-decoration: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .icon-link:hover {
            color: #ffd700; /* Gold color on hover */
        }
        .header-icons .icon {
        display: flex;
        flex-direction: column;
        align-items: center; /* Centers text below the icon */
      }

      .header-icons img {
        width: 30px;
        height: 30px;
        cursor: pointer;
        border-radius: 50%;
        margin-bottom: 5px; /* Adds space between the logo and text */
      }

      .header-icons img:hover {
        opacity: 0.8; /* Slight hover effect */
      }

      .header-icons span {
        font-size: 1.2em;
        color: white;
      }
        footer {
            background-color: #6c9d5b;
            color: white;
            padding: 10px 0;
            text-align: center;
            margin-top: 20px;
        }

        /* ✅ Search Box */
        #searchBox {
            width: 60%;
            padding: 10px;
            font-size: 1.2em;
            border: 2px solid #32CD32;
            border-radius: 5px;
            margin-bottom: 20px;
            outline: none;
        }

        #searchBox:focus {
            border-color: #228B22;
        }

        /* ✅ Product Grid Layout (4 per row) */
        #products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product h2 {
            font-size: 1.2em;
            margin: 10px 0;
            color: #32CD32;
        }

        .product p {
            font-size: 1em;
            margin: 5px 0;
        }

        /* ✅ Add to Cart Button */
        .add-to-cart {
            background: #228B22;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        .add-to-cart:hover {
            background: #1a6622;
        }

        /* ✅ Dark Mode */
        .dark-mode {
            background-color: #333;
            color: white;
        }

        .dark-mode .product {
            background: #444;
            color: white;
        }

        .dark-mode .add-to-cart {
            background: #6c9d5b;
        }

        /* ✅ Toggle Button */
        .toggle-container {
            text-align: center;
            margin: 10px 0;
        }

        .toggle-btn {
            padding: 10px 15px;
            border: none;
            background: #6c9d5b;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .toggle-btn:hover {
            background: #4f7c3a;
        }
    </style>

<!-- ✅ Dark Mode Toggle -->
<div class="toggle-container">
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
</div>

<!-- ✅ Search Box -->
<input type="text" id="searchBox" placeholder="🔍 Search for herbs..." onkeyup="filterProducts()" />

<!-- ✅ Product Display Section -->
<div id="products"></div>

<footer>
    <p>&copy; 2025 FarmXchange. All Rights Reserved.</p>
</footer>

<script>
    let allProducts = []; // Store all products for searching

    // ✅ Fetch and Display Products
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch("http://localhost:5000/products");
            const products = await response.json();

            // ✅ Filter Only Fruits Category
            allProducts = products.filter(product => product.category.toLowerCase() === "herbs");
            displayProducts(allProducts); // Show all products initially
        } catch (error) {
            console.error("❌ Error fetching products:", error);
            document.getElementById("products").innerHTML = "<p>⚠️ Failed to load products</p>";
        }
    });

    // ✅ Function to Display Products
    function displayProducts(products) {
        const productsContainer = document.getElementById("products");
        productsContainer.innerHTML = ""; // Clear previous content

        if (products.length === 0) {
            productsContainer.innerHTML = "<p>⚠️ No products found</p>";
            return;
        }

        products.forEach(product => {
            const productElement = document.createElement("div");
            productElement.classList.add("product");
            productElement.innerHTML = `
                <img src="data:image/jpeg;base64,${product.image || ''}" alt="${product.productName || 'No Name'}">
                <h2>${product.productName || 'No Name'}</h2>
                <p>Category: ${product.category || 'No Category'}</p>
                <p>Quantity: ${product.quantity || '0'} kg</p>
                <p>Price: ₹${product.price || '0'}</p>
                <p>${product.description || 'No Description'}</p>
                <button class="add-to-cart" onclick="addToCart('${product.productName}', ${product.price}, '${product.image}')">🛒 Add to Cart</button>
            `;
            productsContainer.appendChild(productElement);
        });
    }

    // ✅ Search Functionality
    function filterProducts() {
        const searchQuery = document.getElementById("searchBox").value.toLowerCase();

        const filteredProducts = allProducts.filter(product =>
            product.productName.toLowerCase().includes(searchQuery) || 
            product.category.toLowerCase().includes(searchQuery) || 
            product.description.toLowerCase().includes(searchQuery)
        );

        displayProducts(filteredProducts); // Update products displayed
    }

    // ✅ Add to Cart Function
    function addToCart(name, price, image) {
        fetch("http://localhost:5000/add-to-cart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, price, image })
        })
        .then(response => response.json())
        .then(data => alert(data.message))
        .catch(error => console.error("❌ Error adding to cart:", error));
    }

    // ✅ Dark Mode Toggle
    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
    }
</script>
