<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Profile</title>
  <style>
    /* Import Google Font */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Background Styling */
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #32CD32, #228B22); /* Green Gradient */
      overflow: hidden;
    }

    /* Animated Background */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, #32CD32, #2E8B57, #228B22, #006400);
      background-size: 400% 400%;
      animation: gradientBG 6s infinite linear;
      z-index: -1;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Form Container */
    .container {
      position: relative;
      width: 400px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
      max-height: 80vh;  /* Limits height */
      overflow-y: auto;   /* Enables vertical scrolling */
    }

    /* Custom Scrollbar */
    .container::-webkit-scrollbar {
      width: 8px;
    }

    .container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .container::-webkit-scrollbar-thumb {
      background: #fff;
      border-radius: 10px;
    }

    h1 {
      color: Black;
      font-size: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 16px;
      color: black;
      font-weight: bold;
      font-size: 16px;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    input:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid white;
    }

    /* File Upload Styling */
    .file-upload {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      color: white;
    }

    .file-upload:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    button {
      width: 100%;
      padding: 10px;
      background: #fff;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      color: #32CD32;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
    }

    button:hover {
      background: #ddd;
    }

  </style>
</head>
<body>

  <div class="background"></div>

  <div class="container">
    <h1>Farmer Profile</h1>
    <form id="profileForm" action="/submit-profile" method="POST" enctype="multipart/form-data">
      
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">
      
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>
      
      <label for="address">Home Address:</label>
      <textarea id="address" name="address" rows="3" required placeholder="Enter your home address"></textarea>
      
      <label for="shopAddress">Shop Address (if any):</label>
      <textarea id="shopAddress" name="shopAddress" rows="3" placeholder="Enter your shop address (if applicable)"></textarea>
      
      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}" placeholder="Enter your mobile number (10 digits)">
      
      <label for="email">Email ID:</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email ID">
      
      <label for="addressProof" >Address Proof (Upload a document):</label>
      <input type="file" id="addressProof" name="addressProof" required>

      <button type="submit"><a href="newhome.html">Save And Exit</a></button>
    </form>
  </div>

  <script>
    // Form Validation
    document.getElementById('profileForm').addEventListener('submit', function(event) {
      const mobile = document.getElementById('mobile').value;
      if (!/^\d{10}$/.test(mobile)) {
        alert('Please enter a valid 10-digit mobile number.');
        event.preventDefault();
      } else {
        alert("Profile Updated Successfully");
      }
    });
  </script>

</body>
</html>
